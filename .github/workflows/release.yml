name: Publish Skylet Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build, Validate & Publish Release
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Toolchain
        run: |
          for app in /Applications/Xcode_16*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Clone Official DroppyKit SDK
        run: |
          git clone --depth 1 https://gitlab.com/droppyformac1/droppykit.git "${RUNNER_TEMP}/droppykit"
          python3 -c '
          import pathlib, sys, re
          kit = pathlib.Path(sys.argv[1])
          
          # Patch Package.swift tools version and 6.2 settings
          pkg = kit / "Package.swift"
          txt = pkg.read_text().replace("swift-tools-version: 6.2", "swift-tools-version: 6.0")
          txt = txt.replace(".defaultIsolation(MainActor.self)", "")
          pkg.write_text(txt)
          
          # Patch macOS 26.0 unreleased SwiftUI APIs in DroppyKit sources for macOS 15 SDK
          p1 = kit / "Sources/DroppyKit/Capabilities/SettingsPagesProviding.swift"
          if p1.exists():
              t1 = p1.read_text()
              t1 = re.sub(r"\} else if #available\(macOS 26\.0, \*\) \{[\s\S]*?\} else \{", "} else {", t1)
              p1.write_text(t1)
              
          p2 = kit / "Sources/DroppyKit/DesignSystem/DroppyGlassControl.swift"
          if p2.exists():
              t2 = p2.read_text()
              t2 = re.sub(r"if #available\(macOS 26\.0, \*\) \{[\s\S]*?\} else \{([\s\S]*?)\n        \}", r"\1", t2)
              p2.write_text(t2)
              
          p_build = kit / "Scripts/build-droplet.sh"
          if p_build.exists():
              t_build = p_build.read_text()
              t_build = re.sub(r"(-Xswiftc -enable-library-evolution\s*)\\?\s*>/dev/null", r"\1", t_build)
              p_build.write_text(t_build)
          ' "${RUNNER_TEMP}/droppykit"
          echo "${RUNNER_TEMP}/droppykit/Scripts" >> $GITHUB_PATH
          echo "DROPPYKIT_PATH=${RUNNER_TEMP}/droppykit" >> $GITHUB_ENV

      - name: Verify DroppyKit Version
        run: |
          droppykit version

      - name: Run Skylet Automated Unit Tests
        run: |
          swift run SkyletTestsRunner

      - name: Build Universal Shipping Droplet Bundle
        run: |
          droppykit build --arch universal

      - name: Validate Shipping Droplet Bundle
        run: |
          droppykit validate --no-submission

      - name: Verify Universal Mach-O Slices
        run: |
          file .build/Skylet.droplet/Contents/MacOS/Skylet
          lipo -info .build/Skylet.droplet/Contents/MacOS/Skylet

      - name: Run Headless Harness Screenshots
        run: |
          mkdir -p shots
          droppykit run SkyletHarness -- --shots ./shots --report ./shots/report.json || true

      - name: Package Release Bundle & Generate Checksum
        run: |
          cd .build
          zip -r -9 Skylet.droplet.zip Skylet.droplet
          shasum -a 256 Skylet.droplet.zip > Skylet.droplet.zip.sha256
          cat Skylet.droplet.zip.sha256
          echo "RELEASE_SHA256=$(cat Skylet.droplet.zip.sha256 | awk '{print $1}')" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/Skylet.droplet.zip
            .build/Skylet.droplet.zip.sha256
          name: SKYLET ${{ github.ref_name }} — Currency Intelligence & Focus Timer
          draft: false
          prerelease: false
          generate_release_notes: true
