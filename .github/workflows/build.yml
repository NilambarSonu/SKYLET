name: Build, Test & Validate Skylet Droplet

on:
  push:
    branches: [ main, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: macos-15
    steps:
      - name: Checkout Skylet Repository
        uses: actions/checkout@v4

      - name: Select Xcode Toolchain
        run: |
          for app in /Applications/Xcode_16*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Setup DroppyKit SDK
        run: |
          ./ci/setup-droppykit.sh "${RUNNER_TEMP}/droppykit"
          echo "${RUNNER_TEMP}/droppykit/Scripts" >> $GITHUB_PATH
          echo "DROPPYKIT_PATH=${RUNNER_TEMP}/droppykit" >> $GITHUB_ENV

      - name: Verify DroppyKit Version & Pinned Revision
        run: |
          droppykit version

      - name: Run Skylet Unit Test Suite
        run: |
          swift run SkyletTestsRunner

      - name: Build Shipping Droplet Bundle
        run: |
          droppykit build --arch universal

      - name: Validate Built Droplet Bundle
        run: |
          droppykit validate --no-submission

      - name: Verify Universal Mach-O Slices
        run: |
          file .build/Skylet.droplet/Contents/MacOS/Skylet
          lipo -info .build/Skylet.droplet/Contents/MacOS/Skylet

      - name: Run DroppyKit Harness Checks
        run: |
          ./ci/run-harness-checks.sh ./shots

      - name: Package Release Bundle & Generate Checksum
        run: |
          cd .build
          zip -r -9 Skylet.droplet.zip Skylet.droplet
          shasum -a 256 Skylet.droplet.zip > Skylet.droplet.zip.sha256
          cat Skylet.droplet.zip.sha256
          echo "SHA256=$(cat Skylet.droplet.zip.sha256 | awk '{print $1}')" >> $GITHUB_ENV

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: Skylet.droplet
          path: |
            .build/Skylet.droplet.zip
            .build/Skylet.droplet.zip.sha256

      - name: Upload Harness Screenshots and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-reports
          path: shots/
